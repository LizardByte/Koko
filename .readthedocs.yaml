---
# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-lts-latest
  tools:
    rust: latest
    python: "3.14"
  apt_packages:
    - libayatana-appindicator3-dev
    - libglib2.0-dev
    - libgtk-3-dev
    - libxdo-dev
  commands:
    - python -m pip install 'lizardbyte-dockle[all] @ https://github.com/LizardByte/dockle/releases/download/v2026.918.203650/lizardbyte_dockle-2026.918.203650-py3-none-any.whl'
    - python -m dockle check
    - python -m dockle build
    - mkdir -p "${READTHEDOCS_OUTPUT}html/"
    - cp -r _site/. "${READTHEDOCS_OUTPUT}html/"
