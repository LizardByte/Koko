---
name: CI-Rust
permissions: {}

on:
  workflow_call:
    inputs:
      release_version:
        default: ''
        required: false
        type: string

env:
  MACOSX_DEPLOYMENT_TARGET: "15.0"

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        run:
          - test
          - build
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
        include:
          - target: x86_64-unknown-linux-musl  # Alpine
            os: ubuntu-latest
            container: rust:1.96-alpine3.24
            cargo_features: '--no-default-features'
            shell: bash
            build_artifact_prefix: build-alpine
            build_artifact_path: artifacts
          - target: aarch64-unknown-linux-musl  # Alpine
            os: ubuntu-24.04-arm
            container: rust:1.96-alpine3.24
            cargo_features: '--no-default-features'
            shell: bash
            build_artifact_prefix: build-alpine
            build_artifact_path: artifacts
          - target: x86_64-unknown-linux-gnu  # Ubuntu
            os: ubuntu-latest
            container: ''
            cargo_features: ''
            shell: bash
            build_artifact_prefix: build-ubuntu
            build_artifact_path: artifacts
          - target: aarch64-unknown-linux-gnu  # Ubuntu
            os: ubuntu-24.04-arm
            container: ''
            cargo_features: ''
            shell: bash
            build_artifact_prefix: build-ubuntu
            build_artifact_path: artifacts
          - target: x86_64-apple-darwin  # macOS/Intel
            os: macos-latest
            container: ''
            cargo_features: ''
            shell: bash
            build_artifact_prefix: build-macos
            build_artifact_path: build-artifact
          - target: aarch64-apple-darwin  # macOS/Apple Silicon
            os: macos-latest
            container: ''
            cargo_features: ''
            shell: bash
            build_artifact_prefix: build-macos
            build_artifact_path: build-artifact
          - target: x86_64-pc-windows-msvc  # Windows
            os: windows-latest
            container: ''
            cargo_features: ''
            shell: bash
            build_artifact_prefix: build-windows
            build_artifact_path: build-artifact
          - target: aarch64-pc-windows-msvc  # Windows/ARM64
            os: windows-11-arm
            container: ''
            cargo_features: ''
            shell: bash
            build_artifact_prefix: build-windows
            build_artifact_path: build-artifact
        exclude:
          - run: test
            target: aarch64-pc-windows-msvc
    name: ${{ matrix.run == 'test' && 'Test' || 'Build' }} (${{ matrix.target }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      CARGO_TERM_COLOR: always
      INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
      TEST_TOOLCHAIN: nightly  # libtest's JSON output requires nightly.
    steps:
      - name: Fix arm64 Alpine container
        if: runner.arch == 'ARM64' && contains(matrix.container, 'alpine')
        uses: laverdet/alpine-arm64@7f0f72ee2f71eb2324e5888e8b6e42b1b53e6160  # v1.0.0

      - name: Prepare Alpine container
        if: contains(matrix.container, 'alpine')
        shell: sh
        run: |
          set -eux
          apk add --no-cache \
            bash \
            build-base \
            curl \
            git \
            jq \
            nodejs \
            npm \
            openssl-dev \
            openssl-libs-static \
            p7zip \
            pkgconf \
            zlib-dev \
            zlib-static

          echo "/usr/local/cargo/bin" >> "${GITHUB_PATH}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Trust Alpine checkout
        if: contains(matrix.container, 'alpine')
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}/third-party/build-deps"

      - name: Initialize build-deps
        run: git submodule update --init --depth=1 third-party/build-deps

      - name: Install Ubuntu dependencies
        if: matrix.container == '' && contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            jq \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libgtk-3-dev \
            libssl-dev \
            libxdo-dev \
            p7zip-full \
            pkg-config

      - name: Setup Rust
        if: matrix.container == ''
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          target: ${{ matrix.target }}
          cache: true
          cache-on-failure: false

      - name: Setup Node
        if: matrix.container == ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: crates/client-web/package-lock.json

      - name: Install Cargo tools
        if: matrix.run == 'test' || env.INPUT_RELEASE_VERSION != ''
        run: |
          cargo_run_bin_version="$(
            cargo metadata --locked --no-deps --format-version 1 \
              | sed -n 's/.*"cargo-run-bin"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p'
          )"
          if [[ -z "${cargo_run_bin_version}" ]]; then
            echo "Failed to parse cargo-run-bin version from cargo metadata" >&2
            exit 1
          fi
          cargo install --locked cargo-run-bin --version "${cargo_run_bin_version}"
          if [[ -n "${INPUT_RELEASE_VERSION}" ]]; then
            cargo bin cargo-set-version --version
          fi
          if [[ "${{ matrix.run }}" == "test" ]]; then
            rustup toolchain install "${TEST_TOOLCHAIN}" --profile minimal --target ${{ matrix.target }}
            # Tarpaulin clears RUSTUP_TOOLCHAIN on Windows; select nightly for child Cargo processes.
            rustup override set "${TEST_TOOLCHAIN}"
            cargo +"${TEST_TOOLCHAIN}" bin cargo-tarpaulin --version
          fi

      - name: Update Version
        if: matrix.run == 'build' && env.INPUT_RELEASE_VERSION != ''
        run: |
          cargo bin cargo-set-version "${INPUT_RELEASE_VERSION}"
          cargo update --workspace
          cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Build web client
        working-directory: crates/client-web
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Test
        id: test
        if: matrix.run == 'test'
        run: |
          tarpaulin_args=()
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              tarpaulin_args+=(--jobs 1)
              ;;
          esac

          test_status=0
          cargo +"${TEST_TOOLCHAIN}" bin cargo-tarpaulin \
            --locked \
            --color always \
            --engine llvm \
            --timeout 300 \
            "${tarpaulin_args[@]}" \
            --no-fail-fast \
            --out Xml \
            --stderr \
            ${{ matrix.cargo_features }} \
            --target ${{ matrix.target }} \
            --verbose \
            -- -Z unstable-options --format=json --report-time \
            > results.json || test_status=$?
          cargo bin cargo2junit < results.json > junit.xml
          exit "${test_status}"

      - name: Upload coverage artifact
        if: >-
          always() &&
          matrix.run == 'test' &&
          (steps.test.outcome == 'success' || steps.test.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          if-no-files-found: error
          name: coverage-${{ matrix.target }}
          path: |
            cobertura.xml
            junit.xml

      - name: Build
        if: matrix.run == 'build'
        run: |
          cargo build --locked ${{ matrix.cargo_features }} --target ${{ matrix.target }} --release \
            --message-format=json | tee "${RUNNER_TEMP}/cargo-build.json"

      - name: Bundle shared FFmpeg tools
        if: matrix.run == 'build'
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          out_dir="$(jq -ber '
            select(.reason == "build-script-executed" and (.package_id | contains("#koko@"))) | .out_dir
          ' "${RUNNER_TEMP}/cargo-build.json")"
          package_dir="$(cat "${out_dir}/ffmpeg-root.txt")"
          extension=""
          if [[ "${RUST_TARGET}" == *windows* ]]; then
            extension=".exe"
          fi
          destination="target/${RUST_TARGET}/release/ffmpeg"
          mkdir -p "${destination}/bin" "${destination}/share"
          cp "${package_dir}/bin/ffmpeg${extension}" "${package_dir}/bin/ffprobe${extension}" "${destination}/bin/"
          cp -R "${package_dir}/share/licenses" "${destination}/share/"

      - name: Create 7z archive
        if: matrix.run == 'build' && matrix.build_artifact_path == 'artifacts'
        run: |
          mkdir -p artifacts

          extension=""
          if [[ "${{ matrix.target }}" = *"windows"* ]]; then
            extension=".exe"
          fi

          7z a "./artifacts/koko-${{ matrix.target }}.7z" \
            "./assets" \
            "./target/${{ matrix.target }}/release/koko${extension}" \
            "./target/${{ matrix.target }}/release/ffmpeg"

      - name: Prepare build artifact
        if: matrix.run == 'build' && matrix.build_artifact_path == 'build-artifact'
        run: |
          mkdir -p \
            "build-artifact/target/${{ matrix.target }}/release" \
            "build-artifact/crates/client-web"

          extension=""
          if [[ "${{ matrix.target }}" = *"windows"* ]]; then
            extension=".exe"
          fi

          cp \
            "target/${{ matrix.target }}/release/koko${extension}" \
            "build-artifact/target/${{ matrix.target }}/release/koko${extension}"
          cp -R "crates/client-web/dist" "build-artifact/crates/client-web/dist"
          cp -R "target/${{ matrix.target }}/release/ffmpeg" "build-artifact/target/${{ matrix.target }}/release/ffmpeg"

      - name: Upload build artifact
        if: matrix.run == 'build'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          if-no-files-found: error
          name: ${{ matrix.build_artifact_prefix }}-${{ matrix.target }}
          path: ${{ matrix.build_artifact_path }}
