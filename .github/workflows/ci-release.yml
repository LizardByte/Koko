---
name: CI-Release
permissions: {}

on:
  workflow_call:
    inputs:
      release_body:
        required: true
        type: string
      release_generate_release_notes:
        required: true
        type: string
      release_tag:
        required: true
        type: string
    secrets:
      GH_BOT_TOKEN:
        required: true
      VIRUSTOTAL_API_KEY:
        required: false

jobs:
  release:
    name: Release
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts
          pattern: koko-*
          merge-multiple: true

      - name: Debug artifacts
        run: ls -l artifacts

      - name: Create/Update GitHub Release
        uses: LizardByte/actions/actions/release_create@28374bf43cc8b6ee88b9b8a3419b2ac7a6573906  # v2026.928.123224
        with:
          allowUpdates: true
          body: ${{ inputs.release_body }}
          draft: true
          generateReleaseNotes: ${{ inputs.release_generate_release_notes }}
          name: ${{ inputs.release_tag }}
          prerelease: true
          tag: ${{ inputs.release_tag }}
          token: ${{ secrets.GH_BOT_TOKEN }}
          virustotal_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
